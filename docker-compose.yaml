services:
  sequenciador:
    build: ./sequenciador
    ports:
      - "9000:9000"

  db1:
    image: postgres:16
    environment: &pg_env
      POSTGRES_USER: dur
      POSTGRES_PASSWORD: dur
      POSTGRES_DB: dur
    volumes:
      - ./replica/init.sql:/docker-entrypoint-initdb.d/init.sql   # cria a tabela kv
    healthcheck: &pg_health
      test: ["CMD-SHELL", "pg_isready -U dur"]
      interval: 2s
      retries: 10

  db2:
    image: postgres:16
    environment: *pg_env
    volumes:
      - ./replica/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *pg_health

  db3:
    image: postgres:16
    environment: *pg_env
    volumes:
      - ./replica/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *pg_health

  replica1:
    build: ./replica
    environment:
      REPLICA_ID: r1
      DATABASE_URL: postgres://dur:dur@db1:5432/dur
      SEQUENCER_ADDR: sequenciador:9000
    ports: ["8001:8000"]
    depends_on:
      db1: { condition: service_healthy }
      sequenciador: { condition: service_started }

  replica2:
    build: ./replica
    environment:
      REPLICA_ID: r2
      DATABASE_URL: postgres://dur:dur@db2:5432/dur
      SEQUENCER_ADDR: sequenciador:9000
    ports: ["8002:8000"]
    depends_on:
      db2: { condition: service_healthy }
      sequenciador: { condition: service_started }

  replica3:
    build: ./replica
    environment:
      REPLICA_ID: r3
      DATABASE_URL: postgres://dur:dur@db3:5432/dur
      SEQUENCER_ADDR: sequenciador:9000
    ports: ["8003:8000"]
    depends_on:
      db3: { condition: service_healthy }
      sequenciador: { condition: service_started }